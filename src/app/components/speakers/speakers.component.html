<section class="speakers-section">
  <div class="container-boxed speakers-container">
    <div class="text-center heading">
      <h2 class="mb-0 text-bottom-line position-relative">Speakers</h2>
    </div>

    <div class="speakers-grid">
      @for (speaker of speakers; track speaker.id; let i = $index) {
        <article class="speaker-card">
          <div class="portrait" [class.has-mark]="i % 2 === 1">
            <img [src]="speaker.image" [alt]="speaker.name" />
          </div>

          <h3>{{ speaker.name }}</h3>
          <p class="role">{{ speaker.position }}</p>

          @if (speaker.linkedin || speaker.nomadcoder) {
            <div class="social">
              @if (speaker.linkedin) {
                <a
                  target="_blank"
                  rel="noopener noreferrer"
                  [href]="speaker.linkedin"
                  [attr.aria-label]="speaker.name + ' on LinkedIn'"
                >
                  <i class="bi bi-linkedin"></i>
                </a>
              }
              @if (speaker.nomadcoder) {
                <a
                  target="_blank"
                  rel="noopener noreferrer"
                  [href]="speaker.nomadcoder"
                  class="nomadcoder-link"
                  [attr.aria-label]="speaker.name + ' on NomadCoder'"
                  title="NomadCoder"
                >
                  NC
                </a>
              }
            </div>
          }
        </article>
      }
    </div>
  </div>
</section>
