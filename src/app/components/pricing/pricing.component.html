<section class="pricing-section py-5 nmc-bg-light">
  <div class="container-boxed">
    <div class="text-center heading mb-5">
      <h2 class="mb-4 text-bottom-line position-relative">Tickets</h2>
    </div>

    <div class="row g-4 align-items-stretch justify-content-center mt-3">
      @for (ticket of tickets(); track ticket.id) {
      <div class="col-12 col-md-10 col-lg-9 col-xl-8 d-grid align-items-stretch">
        <div class="pricing-table">
          <div class="text-center">
            <h2 class="font-32 nmc-dark-grey fw-bold border-bottom pb-3">
              {{ ticket.title }}
            </h2>

            <ul class="pricing-text my-5">
              @for (feature of ticket.features; track feature) {
              <li class="mb-4">{{ feature }}</li>
              }
            </ul>

            <button
              class="nmc-btn-primary h-auto px-4 py-3 w-100 border-0 enroll-btn"
              type="button"
              [disabled]="ticket.isDisabled"
              (click)="enroll(ticket)"
            >
              {{ ticket.buttonText }}
            </button>
          </div>
        </div>
      </div>
      }
    </div>

    <div
      class="error-label text-danger font-18 d-flex align-items-center justify-content-center mt-5 mb-0"
    >
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      <p class="nmc-medium-grey font-family-inter m-0">
        Tickets once sold can’t be cancelled, transferred, or exchanged.
      </p>
    </div>
  </div>
</section>
